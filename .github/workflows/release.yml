# AGENTV1 FILE START: tag-driven canary publication, never run by local build scripts.
name: canary-release
on:
  push:
    tags: ['v*-canary.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'vinod-cs/observe-agent'
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    # Approval/protection gate only; publish must explicitly create and verify a GitHub Release.
    environment: canary-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: validated-packages-${{ github.sha }}
          path: release-assets
      - name: Publish and verify GitHub prerelease (not environment deployment)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # AGENTV1: record CLI version; publisher logs only non-secret release-state fields.
          gh --version
          python3 -B scripts/publish-release.py
# AGENTV1 FILE END
