# AGENTV1 FILE START: tag-driven canary publication, never run by local build scripts.
name: canary-release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'vinod-cs/observe-agent'
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    # Configure required reviewers for this environment before enabling tag pushes.
    environment: canary-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-packages-${{ github.sha }}
          path: release-assets
      - name: Verify, create draft, upload, then expose as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: vinod-cs/observe-agent
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-canary\.[0-9A-Za-z.]+)?$ ]]
          cd release-assets
          sha256sum --check SHA256SUMS
          version=${RELEASE_TAG#v}
          assets=("observe-agent_${version}_amd64.deb" observe-agent_linux_amd64.deb SHA256SUMS)
          # Never overwrite an existing release or mutate assets on retry.
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Observe Agent $version (canary)" --notes 'Test-only Linux AMD64 DEB. No Windows/RPM/ARM64 installer support or production-readiness claim. Installation does not start the service; configure and validate first.'
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
# AGENTV1 FILE END
