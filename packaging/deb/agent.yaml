# AGENTV1 FILE START: protected metrics plus opt-in Linux file Logs configuration.
# Configure endpoint and one authentication mode, then run --check and start.
observe:
  # Non-secret logical deployment IDs. Keep stable across URLs and API-key rotation.
  backend_id: ""
  organization_id: ""
  # Migration only if a v1 queue still belongs to a different original endpoint:
  # previous_endpoint: "https://<original-endpoint>/api/v1/otlp"
  endpoint: ""
  api_key: ""
  # Safer: raw key (or full ApiKey header) in this environment variable.
  # api_key_env: OBSERVE_API_KEY
  # Or a service-readable root-owned 0640 secret file (raw key/header).
  # api_key_file: /etc/observe-agent/api-key

collection:
  metrics:
    enabled: true
  logs:
    enabled: false
    # Logs state and quota are independent of the existing Metrics spool.
    state_directory: /var/lib/observe-agent/logs
    queue_bytes: 67108864
    queue_items: 1024
    overflow_policy: reject_new
    poll_interval: 1s
    max_files: 256
    files: []
    # Example (direct children of an explicit authorization root only):
    # files:
    #   - id: application
    #     root: /var/log/my-application
    #     include: ["*.log"]
    #     exclude: ["*.gz"]
    #     start_at: end
    #     service_name: my-application
    #     environment: production
    #     max_open_files: 32
    #     max_line_bytes: 262144
    #     multiline:
    #       enabled: false
    #       start_pattern: ""
    #       flush_timeout: 5s
    #       max_lines: 200
    #       max_bytes: 262144
  traces:
    enabled: false

# On EC2 use required: true if metadata availability must be mandatory.
ec2_metadata:
  enabled: true
  required: false
  timeout_seconds: 2

delivery:
  state_directory: /var/lib/observe-agent/metrics
  overflow_policy: reject_new
# AGENTV1 FILE END
